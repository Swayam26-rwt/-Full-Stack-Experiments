<body>
  <h1>Experiment 6 - Scalable Read APIs</h1>

  <h3>APIs</h3>

  <p>Pagination:</p>
  <code>/api/posts?page=0&size=5&sort=likes&order=desc</code>

  <p>Cache:</p>
  <code>/api/posts/cached</code>

  <p>JOIN:</p>
  <code>/api/posts/with-comments</code>

  <p>Native SQL:</p>
  <code>/api/posts/top</code>

  <p>Clear Cache:</p>
  <code>DELETE /api/cache</code>
</body>
